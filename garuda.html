function gauge(v){const c=cat(v),C=339.3;return`<svg width=140 height=140 viewBox="0 0 140 140"><circle cx=70 cy=70 r=54 fill=none stroke="#22222c" stroke-width=12 /><circle cx=70 cy=70 r=54 fill=none stroke="${COL[c]}" stroke-width=12 stroke-linecap=round stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 70 70)" /><text x=70 y=72 text-anchor=middle fill="#fff" font-size=30 font-weight=600 font-family=Inter>${v}</text><text x=70 y=92 text-anchor=middle fill="#8b8b9a" font-size=11 font-family=Inter>/ 100</text></svg>`}
function simOut(){const v=simScore(),c=cat(v),el=$('#simOut');if(el)el.innerHTML=`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${gauge(v)}<div><div>${sevB(c)} <b>${c} Risk</b></div><div class=mu style="margin:4px 0">Route</div><b>${ROUTE[c]}</b></div></div><p class=mu>Why: base score ${S.sim.base}${S.sim.sens?' + 8 sensitive files':''}${S.sim.sec?' + 8 security findings':''}${S.sim.cov?' + 6 lower test coverage':''} = <b>${v}</b>, which falls in the ${c} band (${{Low:'0–29',Medium:'30–59',High:'60–84',Critical:'85–100'}[c]}). Simulating never approves a PR.</p>`}
const filt=()=>S.prs.filter(p=>{const f=S.flt;const ok=f=='all'||(f=='ai'&&p.status=='needs_ai')||(f=='hum'&&p.status=='awaiting_human')||(f=='done'&&['approved','rejected'].includes(p.status));const q=S.q.toLowerCase();return ok&&(!S.hi||p.risk>=60)&&(!q||(p.title+p.repo+p.au+'#'+p.id).toLowerCase().includes(q))});
function dash(){const cl=S.prs.filter(p=>['approved','rejected'].includes(p.status)).length,aw=S.prs.filter(p=>p.status=='awaiting_human').length;
const crit=2+S.sec.filter(s=>s.sev=='Critical'&&s.state=='open').length+S.prs.reduce((a,p)=>a+cnt(p,'Critical'),0);
const cards=[['⎇','Open Pull Requests',24-(cl-1),'▼ 2 vs last week','#3b82f6'],['👤','Awaiting Human Review',8+aw-1,'▲ 1 vs last week','#eab308'],['✦','AI Reviews Completed',156+S.ai,'▲ 18 vs last week','#8b5cf6'],['⚠','Critical Issues Detected',crit,'▼ 1 vs last week','#ef4444']].map(c=>`<div class='card kc' style='--ac:${c[4]}'><div style='display:flex;justify-content:space-between;align-items:center'><span class=ic>${c[0]}</span><span class=tag>demo</span></div><div class=big style='margin-top:12px'>${c[2]}</div><div class=mu>${c[1]}</div><div style='margin-top:8px'><span class=trend>${c[3]}</span></div></div>`).join('');
const rows=filt().map(p=>`<tr class=row data-a=pr data-i=${p.id}><td><b>#${p.id}</b> ${esc(p.title)}</td><td>${p.repo}</td><td>${p.au}</td><td>${sevB(cat(p.risk))}</td><td>${stB(p)}</td><td class=mu>${p.w}</td><td><button class="btn s">Review</button></td></tr>`).join('')||`<tr><td colspan=7 class=empty>No pull requests match your filters.</td></tr>`;
const p=cur(),op=open(p).length,st=[['PR Submitted','done'],['Risk Assessment','done'],['Security Scan',blocked(p)?'fail':p.gate.secret=='passed'?'done':'wait'],['AI Review',p.busy?'act':p.status=='needs_ai'?'wait':'done'],['Finding Triage',p.status=='needs_ai'?'wait':op?'act':'done'],['Human Approval',p.status=='approved'?'done':p.status=='awaiting_human'?'act':'wait']];
return`<div class=hero><div><h1>Good to see you, Abed</h1></div><span class=tag>Demo mode · all data simulated</span></div><div class=dt>${[['over','Overview',''],['queue','Review Queue',S.prs.filter(x=>!['approved','rejected'].includes(x.status)).length],['act','Activity','']].map(t=>`<button class="${S.dtab==t[0]?'on':''}" data-a=dtab data-i=${t[0]}>${t[1]}${t[2]!==''?`<em>${t[2]}</em>`:''}</button>`).join('')}</div>
<div class="tp ${S.anim?'in':''}" style="display:flex;flex-direction:column;gap:16px">${S.dtab=='over'?`<div class=grid4>${cards}</div>
<div class=card><h3>Review Pipeline <span class=mu>PR #${p.id}</span> <select class=btn onchange="S.sel=+this.value;render()" style="margin-left:auto">${S.prs.map(x=>`<option value=${x.id} ${x.id==p.id?'selected':''}>#${x.id} ${esc(x.title)}</option>`).join('')}</select></h3><div class=pipe>${st.map(s=>`<div class="stg ${s[1]}"><b>${s[0]}</b><br><small>${{done:'✓ Completed',act:'● Active',wait:'○ Waiting',fail:'✕ Failed'}[s[1]]}</small></div>`).join('')}</div></div>
<div class=card><h3>Quick Actions</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" data-a=newrev>Review a Pull Request</button><button class=btn data-a=hipr>View High-Risk PRs</button><button class=btn data-a=nav data-i=sec>Run Security Scan</button></div></div>`:S.dtab=='queue'?`<div class=card><h3>Review Queue ${S.hi?'<span class="b s-High">High-risk only</span>':''}</h3><div class=tabs>${[['all','All PRs'],['ai','Needs AI Review'],['hum','Awaiting Human'],['done','Completed']].map(f=>`<button class="btn s ${S.flt==f[0]?'on':''}" data-a=flt data-i=${f[0]}>${f[1]}</button>`).join('')}${S.hi?`<button class="btn s" data-a=clrhi>Clear risk filter</button>`:''}</div><div class=tw><table><tr><th>Pull Request<th>Repository<th>Author<th>Risk<th>Status<th>Time Waiting<th>Action</tr>${rows}</table></div></div>`:`<div class=card><h3>Recent Activity</h3>${S.act.map(a=>`<div class=act-i data-a=actpr data-i=${a.pr}><span class=dot style="background:${a.c}"></span><div>${a.t}<div class=mu>${a.a}</div></div></div>`).join('')}</div>`}</div>`}
function review(){const p=cur(),fl=files(p);if(!p.file||!fl.includes(p.file))p.file=fl[0];const d=diff(p,p.file),c=cat(p.risk),ln=[];let n=d.s;
d.l.forEach(([m,t])=>{const num=m=='-'?'':n++;const h=S.hl&&S.hl.file==p.file&&S.hl.line==num;ln.push(`<div class="ln ${m=='+'?'add':m=='-'?'del':''} ${h?'hl':''}"><span class=n>${num}</span><span class=m>${m}</span><span>${hi(t)}</span></div>`);
if(m!='-')p.findings.filter(f=>f.file==p.file&&f.line==num&&f.state=='open').forEach(f=>ln.push(cmt(p,f)));
if(m!='-'&&h){S.sec.filter(s=>s.pr==p.id&&s.file==p.file&&s.line==num).forEach(s=>ln.push(`<div class=cm style="border-left-color:${COL[s.sev]}">${sevB(s.sev)} <b>${s.t}</b> <span class=tag>security scan</span><p>${s.d}</p></div>`))}});
const tree={};fl.forEach(f=>{const[a,b]=f.split('/');(tree[a]=tree[a]||[]).push(f)});
const need=p.risk>=60,hm=p.human;
return`<div class=card><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b style="font-size:16px">PR #${p.id} — ${esc(p.title)}</b><div class=mu>Repository: ${p.repo} · ${p.au} · Branch: <code>${p.br} → main</code></div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="b st ${['approved','rejected'].includes(p.status)?'w':'ok'}">${['approved','rejected'].includes(p.status)?'Closed':'Open'}</span>${sevB(c)}<span class=b style="border-color:var(--bd)">Risk ${p.risk}/100</span>${stB(p)}<span class="b st ${p.gate.secret=='failed'?'no':p.gate.secret=='passed'?'ok':'w'}">Security: ${p.gate.secret=='failed'?'Failed':p.gate.secret=='passed'?'Passed':p.gate.secret=='running'?'Running':'Not scanned'}</span><span class=tag>simulated AI</span></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start"><button class="btn p" data-a=ai data-i=${p.id} ${p.busy?'disabled':''}>Run AI Review</button><button class=btn data-a=risk data-i=${p.id}>View Risk Assessment</button><button class=btn data-a=scan data-i=${p.id}>Run Security Scan</button></div></div>${blocked(p)?`<div class="warn err" style="margin-top:10px">Security gate failed — AI review is blocked until the critical finding is resolved and the scan is re-run.</div>`:''}</div>
<div class=ws><div class=card><h3>Changed Files</h3>${Object.keys(tree).map(k=>`<div class=mu>▾ ${k}/</div>${tree[k].map(f=>`<div class="file ${f==p.file?'on':''}" data-a=file data-i="${f}" style="margin-left:12px"><span>${f.split('/')[1]||f}</span><span><span style="color:var(--gr)">+${diff(p,f).l.filter(x=>x[0]=='+').length}</span> <span style="color:var(--red)">-${diff(p,f).l.filter(x=>x[0]=='-').length}</span></span></div>`).join('')}`).join('')}</div>
<div class=card style="padding:0"><div style="padding:10px 14px;border-bottom:1px solid var(--bd)" class=mu>${p.file}</div><div class=code style="padding:8px 0">${ln.join('')}</div></div>
<div style="display:flex;flex-direction:column;gap:12px"><div class=card><h3>AI Review Summary <span class=tag>simulated</span></h3>${p.busy?`<div><span class=spin></span> Analyzing changes…</div>`:!p.findings.length?`<div class=empty>No AI review yet. Click Run AI Review.</div>`:`<div class=kv><span class=mu>Result</span><b>${open(p).length?'Changes suggested':'All findings addressed'}</b></div><div class=kv><span class=mu>Open / total findings</span><b>${open(p).length} / ${p.findings.length}</b></div><div style="display:flex;gap:6px;flex-wrap:wrap">${['Critical','High','Medium','Low'].map(s=>`<span class="b s-${s}">${s} ${cnt(p,s)}</span>`).join('')}</div><div class=kv><span class=mu>Suppressed duplicates</span><b>${p.dup||4}</b></div><p class=mu style="margin:8px 0 0">${open(p).length?`Garuda flagged ${open(p).length} issue(s) worth attention and suppressed ${p.dup||4} duplicate/low-value comments. Focus on ${open(p).sort((a,b)=>['Critical','High','Medium','Low'].indexOf(a.sev)-['Critical','High','Medium','Low'].indexOf(b.sev))[0].title.toLowerCase()} first.`:'All findings are resolved or dismissed. Ready for human decision.'}</p>`}</div>
<div class=card><h3>Findings</h3>${p.findings.map(f=>`<div style="padding:8px 0;border-top:1px solid var(--bd);${f.state!='open'?'opacity:.5':''}">${sevB(f.sev)} <b>${f.title}</b><div class=mu>${f.file}:${f.line} · confidence ${f.conf}% ${f.state!='open'?'· '+f.state:''}</div>${f.state=='open'?`<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn s g" data-a=fa data-i=${p.id} data-j=${f.id} data-k=resolved>Mark Resolved</button><button class="btn s" data-a=fa data-i=${p.id} data-j=${f.id} data-k=dismissed>Dismiss</button><button class="btn s" data-a=fa data-i=${p.id} data-j=${f.id} data-k=fix>View Suggested Fix</button></div>${f.show?`<pre class=fix>${esc(f.fix)}</pre>`:''}`:''}</div>`).join('')||`<div class=empty>No findings yet.</div>`}</div></div></div>
<div class=card><h3>Review Completion</h3>${need&&hm!='approved'?`<div class=warn style="margin-bottom:10px">${c} risk: human approval is required before this PR can be fully approved. AI review completion is not approval.</div>`:''}<div class=kv><span class=mu>AI review</span><b>${p.findings.length&&!p.busy?'Complete':'Not complete'}</b></div><div class=kv><span class=mu>Human review</span><b>${hm=='approved'?'Approved':hm=='requested'?'Requested':'Not requested'}</b></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class=btn data-a=hum data-i=${p.id} ${hm!='none'||p.status=='approved'?'disabled':''}>Request Human Review</button><button class="btn g" data-a=app data-i=${p.id} ${p.status=='approved'?'disabled':''}>Approve PR</button><button class="btn r" data-a=rej data-i=${p.id} ${p.status=='rejected'?'disabled':''}>Reject PR</button></div></div>`}
function cmt(p,f){return`<div class=cm style="border-left-color:${COL[f.sev]}"><div>${sevB(f.sev)} <b>${f.title}</b> <span class=tag>AI · ${f.conf}% confidence</span></div><div class=mu>Line ${f.line}</div><p style="margin:6px 0">${f.expl}</p><div class=bar><i style="width:${f.conf}%;background:var(--pu)"></i></div><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn s g" data-a=fa data-i=${p.id} data-j=${f.id} data-k=resolved>Mark Resolved</button><button class="btn s" data-a=fa data-i=${p.id} data-j=${f.id} data-k=dismissed>Dismiss</button><button class="btn s" data-a=fa data-i=${p.id} data-j=${f.id} data-k=fix>Suggested Fix</button></div>${f.show?`<pre class=fix>${esc(f.fix)}</pre>`:''}</div>`}
function risk(){const p=cur(),c=cat(p.risk),so=secOpen(p).length,lb=['Files changed','Lines changed','Sensitive files modified','Auth / payment code affected','Test coverage changes'],vals=['files','lines','sensitive','critical','coverage'];
const fs=p.f.map((v,i)=>[lb[i],v,['','',v>50?'Yes':'No',v>50?'Affected':'None',v>50?'Coverage dropped':'Stable'][i]||v+'%']);fs.splice(4,0,['Security findings',Math.min(100,so*40+(p.gate.secret=='failed'?30:0)),so+' open']);
return`<div class=card><h3>Risk Overview <select id=x style="display:none"></select>${S.prs.map(x=>`<button class="btn s ${x.id==p.id?'on':''}" data-a=risk data-i=${x.id}>#${x.id}</button>`).join('')}</h3><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">${gauge(p.risk)}<div><div>${sevB(c)} <b style="font-size:16px">${c} Risk</b></div><div class=mu style="margin-top:4px">PR #${p.id} — ${esc(p.title)}</div><div class=mu style="margin-top:8px">Recommended route</div><b>${ROUTE[c]}</b><div style="margin-top:8px"><button class=btn data-a=pr data-i=${p.id}>Open PR Review</button></div></div></div></div>
<div class=g2><div class=card><h3>Risk Factors</h3>${fs.map(f=>`<div style="margin:9px 0"><div class=kv style="padding:0"><span>${f[0]}</span><span class=mu>${f[2]}</span></div><div class=bar><i style="width:${f[1]}%;background:${f[1]>75?'var(--red)':f[1]>50?'var(--or)':f[1]>30?'var(--ye)':'var(--gr)'}"></i></div></div>`).join('')}</div>
<div class=card><h3>Risk Categories <span class=tag>configurable prototype policy</span></h3>${[['Low','0–29','AI-first review'],['Medium','30–59','AI review, human review per policy'],['High','60–84','Mandatory human review'],['Critical','85–100','Block approval until security checks and required human reviews are complete']].map(r=>`<div style="padding:7px 0;border-top:1px solid var(--bd)">${sevB(r[0])} <b>${r[1]}</b><div class=mu>${r[2]}</div></div>`).join('')}</div></div>
<div class=card><h3>Interactive Risk Simulator <span class=tag>simulation only</span></h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px"><div><select id=simpr class=btn style="width:100%;margin-bottom:10px">${S.prs.map(x=>`<option value=${x.id} ${x.id==S.sim.pr?'selected':''}>#${x.id} ${esc(x.title)}</option>`).join('')}</select><div class=mu>Base risk score: <b id=slv>${S.sim.base}</b></div><input id=sl type=range min=0 max=100 value=${S.sim.base} oninput="$('#slv').textContent=this.value"><label class=tg><input type=checkbox data-sim=sens ${S.sim.sens?'checked':''}> Sensitive-file changes (+8)</label><label class=tg><input type=checkbox data-sim=sec ${S.sim.sec?'checked':''}> Security findings (+8)</label><label class=tg><input type=checkbox data-sim=cov ${S.sim.cov?'checked':''}> Test coverage decreased (+6)</label><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class=btn data-a=simreset>Reset Simulation</button><button class="btn p" data-a=apply>Apply to PR (routing only)</button></div></div><div id=simOut></div></div></div>`}
function sec(){const p=cur(),o=S.sec.filter(s=>s.state=='open'),sc=S.sec.find(s=>s.id==S.secSel)||S.sec[0],pass=S.prs.filter(x=>Object.values(x.gate).every(v=>v=='passed')).length;
const ck=[['secret','Secret detection'],['sast','Static code analysis'],['dep','Dependency scanning'],['policy','Security policy checks']];
const cards=[['Total Findings',S.sec.length+9],['Critical Vulnerabilities',o.filter(s=>s.sev=='Critical').length],['Secrets Detected',o.filter(s=>s.type=='secret').length],['Security Scans Passed',pass+20]].map(c=>`<div class=card><div class=mu>${c[0]} <span class=tag>demo data</span></div><div class=big>${c[1]}</div></div>`).join('');
return`<div class=grid4>${cards}</div><div class=card style="border-color:${blocked(p)?'#7f1d1d':'var(--bd)'}"><h3>Security Gate — PR #${p.id} ${S.prs.map(x=>`<button class="btn s ${x.id==p.id?'on':''}" data-a=risk data-i=${x.id} style="display:none"></button>`).join('')}<select class=btn onchange="S.sel=+this.value;render()">${S.prs.map(x=>`<option value=${x.id} ${x.id==p.id?'selected':''}>#${x.id} ${x.repo}</option>`).join('')}</select><button class="btn p" data-a=scan data-i=${p.id} ${S.scanning?'disabled':''} style="margin-left:auto">${S.scanning?'<span class=spin></span> Scanning…':'Run Security Scan'}</button></h3><div class=grid4>${ck.map(c=>{const v=p.gate[c[0]];return`<div class=stg style="border-color:${v=='failed'?'#7f1d1d':v=='passed'?'#14532d':'var(--bd)'}"><b>${c[1]}</b><br><span class="b st ${v=='passed'?'ok':v=='failed'?'no':v=='running'?'':'w'}">${v=='running'?'<span class=spin></span> Running':v=='pending'?'Not run':v[0].toUpperCase()+v.slice(1)}</span></div>`}).join('')}</div>${blocked(p)?`<div class="warn err" style="margin-top:10px">Gate failed: AI review is blocked for PR #${p.id} until the critical finding is resolved and the scan passes.</div>`:''}</div>
<div class=g2><div class=card><h3>Security Scan Results</h3><div class=tw><table><tr><th>Finding<th>Repository<th>Severity<th>File<th>Status<th>Action</tr>${S.sec.map(s=>`<tr class=row data-a=ssel data-i=${s.id} style="${s.id==sc.id?'background:#191922':''}"><td>${s.t}</td><td>${s.repo}</td><td>${sevB(s.sev)}</td><td><code>${s.file}</code></td><td><span class="b st ${s.state=='open'?'no':'ok'}">${s.state}</span></td><td><button class="btn s" data-a=sopen data-i=${s.id}>Open in PR</button></td></tr>`).join('')}</table></div></div>
<div class=card><h3>Finding Details</h3><div>${sevB(sc.sev)} <b>${sc.t}</b></div><div class=mu style="margin:4px 0">${sc.file}:${sc.line} · PR #${sc.pr}</div><p><b>Description</b><br>${sc.d}</p><p><b>Potential impact</b><br>${sc.imp}</p><p><b>Recommended remediation</b><br>${sc.fix}</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn s g" data-a=sa data-i=${sc.id} data-k=resolved ${sc.state!='open'?'disabled':''}>Mark Resolved</button><button class="btn s" data-a=sa data-i=${sc.id} data-k=dismissed ${sc.state!='open'?'disabled':''}>Dismiss Finding</button><button class="btn s" data-a=sa data-i=${sc.id} data-k=rescan>Re-run Scan</button></div></div></div>`}
function render(keep){const pg=S.page,T={dash:'Dashboard',rev:'PR Review',risk:'Risk Assessment',sec:'Security'};const nav=[['dash','▦','Dashboard'],['rev','⎇','PR Review'],['risk','◔','Risk Assessment'],['sec','🛡','Security']];
$('#root').innerHTML=`<div class=app><aside><div class=logo><i>🦅</i>Garuda</div>${nav.map(n=>`<button class="nav ${pg==n[0]?'on':''}" data-a=nav data-i=${n[0]}><span>${n[1]}</span>${n[2]}</button>`).join('')}<div class=side-b><div class=mu>⌥ GitHub org: <b style="color:var(--tx)">garuda-demo</b> <span class=tag>demo</span></div><div style="display:flex;align-items:center;gap:8px"><div class=av>A</div><b>Abed</b><button class="btn s" data-a=set style="margin-left:auto" title=Settings>⚙</button></div></div></aside>
<main><div class=top><div class=crumb>Garuda / <b>${T[pg]}</b>${pg=='rev'?' / #'+S.sel:''}</div><input type=text id=q class=search placeholder="Search pull requests…" value="${esc(S.q)}"><button class=btn data-a=bell>🔔</button><button class=btn data-a=reset>Reset Demo</button><button class=btn data-a=demo>Try Demo</button><button class="btn p" data-a=newrev>+ New Review</button></div>
${S.notif?`<div class="card notif">${S.act.slice(0,5).map(a=>`<div class=act-i data-a=actpr data-i=${a.pr}><span class=dot style="background:${a.c}"></span><div>${a.t}<div class=mu>${a.a}</div></div></div>`).join('')}</div>`:''}
<div class="pg ${S.anim?'in':''}">${{dash,rev:review,risk,sec}[pg]()}</div></main></div>`;
S.anim=0;if(pg=='risk')simOut();if(keep){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
render();
</script></body></html>
